
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobTrack | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'DM Sans', sans-serif;
    color: #be246c;
    background:
        radial-gradient(circle at 10% 10%, #e7dcff 0, transparent 35%),
        radial-gradient(circle at 90% 85%, #dfe8ff 0, transparent 35%),
        #f8f6fc;
}

.login-container {
    width: 100%;
    max-width: 420px;
}

.brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 27px;
}

.brand-icon {
    width: 47px;
    height: 47px;
    display: grid;
    place-items: center;
    border-radius: 25px;
    color: rgb(255, 255, 255);
    font-size: 30px;
    background: linear-gradient(135deg, #8971f3, #8065ed);
    box-shadow: 0 8px 20px #8065ed35;
}

.brand-name {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #8076a0;
    margin: 0;
}

.brand-caption {
    color: #4b26b1;
    font-size: 15px;
    letter-spacing: 2px;
    font-weight: 700;
    margin-top: 3px;
}

.login-card {
    padding: 37px 34px;
    background: #ebd7ffed;
    border: 1px solid #8d6ac3;
    border-radius: 23px;
    box-shadow: 0 20px 60px #7d45ff12;
}

.welcome-label {
    font-size: 10px;
    letter-spacing: 2px;
    font-weight: 800;
    color: #8065ed;
    margin-bottom: 12px;
}

.login-card h1 {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -.5px;
    margin-bottom: 10px;
    color: #30264f;
}

.subtitle {
    color: #746b89;
    font-size: 12px;
    line-height: 1.8;
    margin-bottom: 28px;
}

.form-label {
    font-size: 12px;
    font-weight: 700;
    color: #736166;
    margin-bottom: 8px;
}

.input-group-custom {
    position: relative;
    margin-bottom: 19px;
}

.input-icon {
    position: absolute;
    top: 50%;
    left: 15px;
    transform: translateY(-50%);
    color: #2b1879;
    z-index: 2;
    font-size: 13px;
}

.form-control {
    height: 48px;
    padding: 12px 42px;
    border: 1px solid #e6e0f0;
    border-radius: 11px !important;
    background: #fcfbff;
    color: #30264f;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    box-shadow: none !important;
}

.form-control::placeholder {
    color: #9085aa;
}

.form-control:focus {
    border-color: #9c85f5;
    background: #ffffff;
}

.password-toggle {
    position: absolute;
    top: 50%;
    right: 14px;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    color: #82799b;
    cursor: pointer;
    z-index: 3;
}

.login-button {
    width: 100%;
    height: 48px;
    margin-top: 6px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(110deg, #7256d1, #9278ec);
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 800;
    transition: .25s;
    box-shadow: 0 8px 20px #8065ed25;
}

.login-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px #8065ed35;
}

.error-message {
    display: none;
    color: #fc125c;
    background: #fff0f4;
    border: 1px solid #ffd7e2;
    border-radius: 9px;
    padding: 10px 12px;
    margin-bottom: 16px;
    font-size: 11px;
}

.login-footer {
    margin-top: 23px;
    text-align: center;
    color: #8c829f;
    font-size: 10px;
}

.login-footer i {
    color: #8065ed;
    margin-right: 5px;
}

.copyright {
    text-align: center;
    margin-top: 22px;
    font-size: 10px;
    color: #160249;
}

@media (max-width: 480px) {
    .login-card {
        padding: 29px 23px;
    }

    .login-card h1 {
        font-size: 29px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <div class="brand">
        <div class="brand-icon">
            <i class="fa-solid fa-layer-group"></i>
        </div>
        <div>
            <h2 class="brand-name">JobTrack</h2>
            <div class="brand-caption">CAREER JOURNAL</div>
        </div>
    </div>

    <div class="login-card">
        <div class="welcome-label">WELCOME BACK</div>
        <h1>Let's get started.</h1>
        <p class="subtitle">
            Sign in to manage your job applications and keep your career journey organised.
        </p>

        <div class="error-message" id="errorMessage" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            Incorrect username or password. Please try again.
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group-custom">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group-custom">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="password-toggle" id="togglePassword"
                            aria-label="Show password">
                        <i class="fa-regular fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button">
                Sign In <i class="fa-solid fa-arrow-right ms-2"></i>
            </button>
        </form>

        <div class="login-footer">
            <i class="fa-solid fa-shield-halved"></i>
            Your career workspace starts here.
        </div>
    </div>

    <div class="copyright">
        © 2026 JobTrack · Career Journal
    </div>
</div>

<script>
const USERNAME = "syisyi";
const PASSWORD = "12345";

document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const errorMessage = document.getElementById("errorMessage");

    if (username === USERNAME && password === PASSWORD) {
        sessionStorage.setItem("jobSystemLoggedIn", "true");
        window.location.href = "dashboard.html";
    } else {
        errorMessage.style.display = "block";
        document.getElementById("password").value = "";
        document.getElementById("password").focus();
    }
});

document.getElementById("togglePassword").addEventListener("click", function() {
    const passwordInput = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");
    const isPassword = passwordInput.type === "password";

    passwordInput.type = isPassword ? "text" : "password";
    eyeIcon.className = isPassword
        ? "fa-regular fa-eye-slash"
        : "fa-regular fa-eye";

    this.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
});

document.getElementById("username").addEventListener("input", hideError);
document.getElementById("password").addEventListener("input", hideError);

function hideError() {
    document.getElementById("errorMessage").style.display = "none";
}
</script>

</body>
</html>
